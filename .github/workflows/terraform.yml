name: terraform-plan

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive -diff
        working-directory: infra

  plan:
    name: plan (${{ matrix.env }})
    needs: fmt
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    defaults:
      run:
        working-directory: infra/envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Plan-only: swap the S3 backend for a throw-away local one so the
      # workflow needs no AWS credentials. offline_plan=true in tfvars skips
      # credential/account lookups in the provider.
      - name: Use local backend (plan-only)
        run: |
          cat > backend_override.tf <<'TF'
          terraform {
            backend "local" {
              path = "terraform.tfstate"
            }
          }
          TF

      - name: terraform init
        run: terraform init -input=false

      - name: terraform validate
        run: terraform validate -no-color

      - name: terraform plan
        run: |
          terraform plan -refresh=false -input=false -lock=false -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt

      # 1) clearly visible workflow output
      - name: Publish plan to job summary
        if: always()
        run: |
          {
            echo "### Terraform plan: ${{ matrix.env }}"
            echo '```'
            head -c 60000 plan.txt 2>/dev/null || echo "no plan produced"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 2) workflow artifact
      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}
          path: |
            infra/envs/${{ matrix.env }}/plan.txt
            infra/envs/${{ matrix.env }}/tfplan
          if-no-files-found: ignore

      # 3) PR comment (one comment per env, updated on every push)
      - name: Comment plan on PR
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const env = '${{ matrix.env }}';
            const marker = `<!-- tfplan-${env} -->`;
            const file = `infra/envs/${env}/plan.txt`;
            let plan = fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : 'No plan produced (see workflow logs).';
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... truncated, see artifact ...';
            const body = `${marker}\n### Terraform plan: \`${env}\`\n<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n</details>`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
